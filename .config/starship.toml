"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"
add_newline = false
command_timeout = 1000
scan_timeout = 100

# A flat, lightweight prompt: primary context on the left, contextual tooling
# in the middle, and transient diagnostics aligned on the right.
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$git_metrics\
$python\
$rust\
$golang\
$java\
$kotlin\
$haskell\
$lua\
$php\
$package\
$docker_context\
$kubernetes\
$terraform\
$aws\
$gcloud\
$container\
$fill\
$memory_usage\
${custom.lorri}\
$battery\
$cmd_duration\
$status\
$jobs\
$time\
$line_break\
$character"""

continuation_prompt = "[∙ ](fg:overlay0)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[fill]
symbol = " "

# Session context stays compact locally and expands automatically over SSH or as root.
[os]
disabled = false
style = "fg:overlay1"
format = "[$symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = false
style_user = "fg:subtext0"
style_root = "fg:red"
format = "[$user ]($style)"

[hostname]
ssh_only = true
style = "fg:subtext0"
format = "[@$hostname ]($style)"
trim_at = "."

[directory]
style = "fg:blue"
read_only_style = "fg:red"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# Git stays detailed without adding visual weight: branch, working tree, sync,
# operation, and line-diff information appear only inside repositories.
[git_branch]
symbol = ""
style = "fg:mauve"
format = "[ $symbol $branch(:$remote_branch)]($style)"
truncation_length = 28
truncation_symbol = "…"

[git_status]
style = "fg:peach"
format = "[$all_status$ahead_behind]($style)"
conflicted = " ~${count}"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked = " ?${count}"
stashed = " *${count}"
modified = " !${count}"
staged = " +${count}"
renamed = " »${count}"
deleted = " ✘${count}"
up_to_date = ""

[git_state]
style = "fg:yellow"
format = "[ $state( $progress_current/$progress_total)]($style)"

[git_metrics]
disabled = false
added_style = "fg:green"
deleted_style = "fg:red"
format = "([ +$added]($added_style))([ -$deleted]($deleted_style))"
only_nonzero_diffs = true


# Tooling appears only when the current directory activates it.
[python]
symbol = ""
style = "fg:yellow"
format = " [$symbol$version( \\($virtualenv\\))]($style)"

[rust]
symbol = ""
style = "fg:peach"
format = " [$symbol$version]($style)"

[golang]
symbol = ""
style = "fg:sky"
format = " [$symbol$version]($style)"

[java]
symbol = ""
style = "fg:red"
format = " [$symbol$version]($style)"

[kotlin]
symbol = ""
style = "fg:mauve"
format = " [$symbol$version]($style)"

[haskell]
symbol = ""
style = "fg:mauve"
format = " [$symbol$version]($style)"

[lua]
symbol = ""
style = "fg:blue"
format = " [$symbol$version]($style)"

[php]
symbol = ""
style = "fg:lavender"
format = " [$symbol$version]($style)"

[package]
symbol = "󰏗"
style = "fg:subtext0"
format = " [$symbol$version]($style)"

[docker_context]
symbol = ""
style = "fg:blue"
format = " [$symbol$context]($style)"
only_with_files = true

[kubernetes]
disabled = false
symbol = "󱃾"
style = "fg:sapphire"
format = " [$symbol$context(::$namespace)]($style)"

[terraform]
symbol = "󱁢"
style = "fg:mauve"
format = " [$symbol$workspace]($style)"

[aws]
symbol = ""
style = "fg:peach"
format = " [$symbol$profile( \\($region\\))]($style)"

[gcloud]
symbol = "󱇶"
style = "fg:blue"
format = " [$symbol$project]($style)"

[container]
symbol = "⬢"
style = "fg:peach"
format = " [$symbol $name]($style)"


# The right edge is quiet in the common case: time is constant; the rest appears
# only when it needs attention.
[memory_usage]
disabled = false
threshold = 80
symbol = "󰍛"
style = "fg:yellow"
format = "[$symbol $ram_pct]($style) "

[custom.lorri]
description = "Loaded lorri environment"
when = 'test -n "$LORRI_PROJECT"'
shell = ["sh"]
command = '''
project_dir=${LORRI_PROJECT%/*}
printf '%s' "${project_dir##*/}"
'''
# Match the ANSI TTY tmux session marker (ansi_cyan).
style = "fg:#87afaf"
format = "[$output]($style) "

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 10
style = "fg:red"

[[battery.display]]
threshold = 25
style = "fg:yellow"

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:yellow"
format = "[󰔛 $duration]($style) "

[status]
disabled = false
symbol = "✘ "
success_symbol = ""
style = "fg:red"
format = "[$symbol$status]($style) "
map_symbol = true

[jobs]
symbol = "󰜎"
style = "fg:sapphire"
number_threshold = 1
symbol_threshold = 1
format = "[$symbol$number]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = "[ $time]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](fg:mauve)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:mauve)"
vimcmd_replace_one_symbol = "[❮](fg:peach)"
vimcmd_replace_symbol = "[❮](fg:peach)"
vimcmd_visual_symbol = "[❮](fg:yellow)"
