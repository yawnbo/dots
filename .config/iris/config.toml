[core]
version = 1
shell = "zsh"
mode = "last"
debug = false
expand-alias = true

[ui]
style = "modern"
ghost-text = true
hidden-files = false
max-suggestions = 100
max-height = 15
nerd-fonts = true

[keybindings]
toggle-mode = "ctrl+r"
toggle-menu = "shift+tab"

[git]
filter-active-branch = true
deduplicate-branches = true

[updater]
check-on-startup = true
channel = "stable"
check-interval = "24h"

[ai]
enabled = false
provider = ""
debounce_ms = 500
min_interval_ms = 1000

[ai.suggest_on_empty]
enabled = false
debounce_ms = 800
min_interval_ms = 5000
